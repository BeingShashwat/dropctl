spring:
    application:
        name: dropctl
    config:
        import: optional:file:.env[.properties]
    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
    flyway:
        enabled: true
        location: classpath:db/migration
    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: validate
    servlet:
        multipart:
            max-file-size: 10MB
            max-request-size: 10MB
    data:
        redis:
            host: ${REDIS_HOST}
            port: ${REDIS_PORT}

dropctl:
    upload:
        allowed-types:
            # extension: [canonical content type, other sniffed types accepted for it...]
            jpg:  [image/jpeg]
            jpeg: [image/jpeg]
            png:  [image/png]
            gif:  [image/gif]
            webp: [image/webp]
            pdf:  [application/pdf]
            txt:  [text/plain]
            csv:  [text/csv, text/plain]
            docx: [application/vnd.openxmlformats-officedocument.wordprocessingml.document, application/x-tika-ooxml, application/zip]
            xlsx: [application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/x-tika-ooxml, application/zip]
            pptx: [application/vnd.openxmlformats-officedocument.presentationml.presentation, application/x-tika-ooxml, application/zip]
    storage:
        bucket: ${S3_BUCKET_NAME}
        region: ${AWS_REGION}
        access-key: ${AWS_ACCESS_KEY_ID:}
        secret-key: ${AWS_SECRET_ACCESS_KEY:}
    expiry:
        default-hours: 24
        max-hours: 168
        cleanup-interval: PT5M
        cleanup-batch-size: 50
    app:
        base-url: ${APP_BASE_URL}
    rate-limit:
        upload:
            window: PT1H
            max-requests: 10
    proxy:
        trust-forwarded-headers: false

server:
    shutdown: graceful

management:
    endpoints:
        web:
            exposure:
                include: health, info
    endpoint:
        health:
            probes:
                enabled: true