spring:
    application:
        name: dropctl
    config:
        import: optional:file:.env[.properties]
    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: none

server:
    shutdown: graceful

management:
    endpoints:
        web:
            exposure:
                include: health, info
    endpoint:
        health:
            probes:
                enabled: true